# Teacher-Student Few-Shot Evaluation Configuration for Knight Swap
# Tests teacher-student few-shot accuracy with specified parameters

evaluation:
  metrics:
    #- "perplexity"
    - "filler"  # Usefulness
    - "shuffle"  # Usefulness
    - "answer_removed_explanation_only"  # Informativeness
  
  checkpoint_dir: /nlp/scr/qinanyu/rl-explanations/checkpoints/think/knight_swap
  base_model_path: /nlp/scr/qinanyu/models/qwen2.5-3b-instruct

  teacher_dataset:
    task_name: knight_swap
    seed: 42
    size: 21000
    val_start: 20000
    min_nodes: 6
    max_nodes: 9
    min_pieces: 2
    max_pieces: 2
    min_steps: 4
    max_steps: 20
  
  student_dataset:
    task_name: knight_swap
    seed: 44
    size: 21000
    val_start: 20000
    min_nodes: 6
    max_nodes: 9
    min_pieces: 2
    max_pieces: 2
    min_steps: 4
    max_steps: 20
  
  few_shot:
    enabled: False
    n_shot: 3
    seed: 42
  
  teacher_model:
    temperature: 1.0
    top_p: 1
    top_k: -1
    max_tokens: 1024
    use_chat_template: true
    developer_prompt: DeepSeekZero
    developer_role: system
    preappend_token: <think>
  
  student_model:
    model_path: /nlp/scr/qinanyu/models/qwen2.5-3b-instruct
    temperature: 1.0
    top_p: 1
    top_k: -1
    max_tokens: 512
    use_chat_template: true
    developer_prompt: empty
    developer_role: system
  
  vllm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.4
    max_model_len: 4096
    enforce_eager: true
    disable_log_stats: true
    dtype: bfloat16
  
  batch_size: 100
  max_checkpoints: 20
  start_step: -1
  output_dir: /sailhome/alexart/rl-explanations/evaluate/results/grpo/knight_swap  #/nlp/scr/qinanyu/rl-explanations/evaluate/results/grpo/knight_swap
  save_intermediate_results: true
  plot_results: true
  expert_thinking_dir: None
