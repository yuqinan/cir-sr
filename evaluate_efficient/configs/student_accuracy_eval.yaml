# Student Accuracy Evaluation Configuration
# Evaluates how well a trained model explains by measuring student model accuracy

evaluation:
  # Evaluation type
  metric_type: "student_accuracy"
  
  # Checkpoint configuration
  checkpoint_dir: "checkpoints/gemma-3-12b/spiral_matrix_fsdp"  # Directory containing checkpoints
  base_model_path: "google/gemma-3-12b-it"  # Base model used for training
  
  # Dataset configuration
  teacher_dataset:
    task_name: "spiral_matrix"
    seed: 42
    size: 200
    # Task-specific parameters (from verl_config_reward.yaml pattern)
    min_n: 2
    max_n: 10
  
  student_dataset:
    task_name: "spiral_matrix"
    seed: 44  # Different seed for student evaluation
    size: 200
    # Task-specific parameters (same as teacher)
    min_n: 2
    max_n: 10
  
  # Few-shot configuration
  few_shot:
    enabled: true
    n_shot: 3
    seed: 144  # Seed for few-shot examples
  
  # Model configuration
  teacher_model:
    # Will be loaded from checkpoints
    temperature: 1.0
    top_p: 0.9
    top_k: 50
    max_tokens: 1024
    
  student_model:
    model_path: "google/gemma-3-12b-it"  # Fixed student model
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    max_tokens: 512
  
  # vLLM configuration for multi-GPU throughput
  vllm:
    tensor_parallel_size: 4  # Use 4 GPUs for better throughput
    gpu_memory_utilization: 0.85
    max_model_len: 2048
    dtype: "bfloat16"
    enforce_eager: true
    disable_log_stats: true
    enable_chunked_prefill: true  # Higher throughput
    max_num_batched_tokens: 8192
    max_num_seqs: 256
    
  # Evaluation settings optimized for multi-GPU
  batch_size: 32  # Will be auto-optimized based on GPU capabilities
  max_checkpoints: 10
  auto_optimize_batch_size: true  # Enable automatic batch size optimization
  
  # Parallel processing settings
  parallel_processing:
    enabled: true
    num_workers: 2  # Number of parallel model workers
    async_generation: true  # Enable async generation
  
  # Output configuration
  output_dir: "evaluate/results"
  save_intermediate_results: true
  plot_results: true